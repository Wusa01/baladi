<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}بلدي | Baladi{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">
            <span class="brand-icon">ب</span>
            بلدي <small>Baladi</small>
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" href="#about">عن المنصة</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#how-it-works">كيف تعمل؟</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#issues">المشكلات</a>
                </li>
            </ul>

            <a href="#" class="btn btn-success">تقديم بلاغ</a>
        </div>
    </div>
</nav>

<main>
    {% block content %}{% endblock %}
</main>

<footer class="footer mt-5">
    <div class="container py-4 text-center">
        <h5>بلدي | Baladi</h5>
        <p>منصة مدنية لتحسين الخدمات العامة في أنجمينا.</p>
        <small>جميع الحقوق محفوظة © 2026 Baladi</small>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>
